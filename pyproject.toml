[project]
name = "semantic-search-benchmarker"
version = "0.1.0"
description = "AD 331 technical document retrieval workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
 "chromadb>=1.0,<2",
 "fastapi>=0.115,<1",
 "fastembed>=0.5,<1",
 "numpy>=1.26,<3",
 "pydantic>=2,<3",
 "rank-bm25==0.2.2",
 "tiktoken>=0.8,<1",
 "uvicorn>=0.32,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
